name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run verification tests
        run: node test/self-check.js

      - name: Clean previous builds
        run: if (Test-Path dist) { Remove-Item -Recurse -Force dist }

      - name: Sync package.json version with Git tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Release workflow triggered by ref: $tag"
          if ($tag -match '^v?(\d+\.\d+\.\d+.*)$') {
            $ver = $Matches[1]
            Write-Host "Updating package.json version to: $ver"
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $pkg.version = $ver
            $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          }

      - name: Build Windows Installer & Portable Executable
        run: npx electron-builder --win nsis portable --publish never

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.1' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'MyFiles v1.1.1' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
